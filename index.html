<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patente dell'iPad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Atkinson Hyperlegible",system-ui,sans-serif;
  --azione:#007AFF; --ok:#34C759; --ok-testo:#1A7A34; --ambra:#FF9500; --ambra-testo:#9A5200;
  /* contrasto >=4.5:1 (verificato): --azione-testo per testi blu su vetro, --azione-fondo per sfondi con testo bianco */
  --azione-testo:#0062CC; --azione-fondo:#0062CC;
  --coppia-1:#0062CC; --coppia-2:#8E3FD0; --coppia-3:#00796B; --coppia-4:#B35200; --su-coppia:#fff;
  --oro:#C9A227; --viola:#AF52DE;
  --testo:#1C1C1E; --testo-2:#48484A; --sfondo:#EEF1F7;
  --vetro:rgba(255,255,255,.58); --vetro-forte:rgba(255,255,255,.78); --bordo:rgba(255,255,255,.75);
  --ombra:0 10px 40px rgba(30,40,80,.14); --r:22px;
  --wall:radial-gradient(1200px 700px at 10% -10%,#B9D4FF 0,transparent 60%),
         radial-gradient(900px 600px at 110% 10%,#E4C8FF 0,transparent 55%),
         radial-gradient(900px 700px at 50% 120%,#BFF0DA 0,transparent 60%),#EEF1F7;
}
@media (prefers-color-scheme:dark){:root{
  --azione:#0A84FF; --ok:#30D158; --ok-testo:#30D158; --ambra:#FF9F0A; --ambra-testo:#FFB340;
  --azione-testo:#4DA3FF; --azione-fondo:#0060DF;
  --coppia-1:#4DA3FF; --coppia-2:#C58AF5; --coppia-3:#2FD0C0; --coppia-4:#FFA64D; --su-coppia:#0B0D14;
  --testo:#F2F2F7; --testo-2:#C7C7CC; --sfondo:#0B0D14;
  --vetro:rgba(44,46,58,.55); --vetro-forte:rgba(44,46,58,.8); --bordo:rgba(255,255,255,.14);
  --ombra:0 10px 40px rgba(0,0,0,.5);
  --wall:radial-gradient(1200px 700px at 10% -10%,#1A3A7A 0,transparent 60%),
         radial-gradient(900px 600px at 110% 10%,#4A2A6E 0,transparent 55%),
         radial-gradient(900px 700px at 50% 120%,#13493A 0,transparent 60%),#0B0D14;
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);font-size:18px;line-height:1.45;color:var(--testo);background:var(--wall);background-attachment:fixed;-webkit-text-size-adjust:100%}
.vetro{background:var(--vetro);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--bordo);border-radius:var(--r);box-shadow:var(--ombra)}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
.schermata{display:none}.schermata.attiva{display:block}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
h2{font-size:26px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn{min-height:48px;padding:10px 22px;border-radius:14px;border:0;background:var(--azione-fondo);color:#fff;font-weight:700}
.btn.sec{background:var(--vetro-forte);color:var(--azione-testo);border:1px solid var(--bordo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--azione);outline-offset:2px}
footer{text-align:center;color:var(--testo-2);font-size:18px;margin-top:32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ipad-gesto{width:100%;max-width:360px;display:block;margin:0 auto}
.g-cornice{fill:#1C1C1E}.g-schermo{fill:#DCE6FA}
.g-barra{fill:#1C1C1E;opacity:.5}
.g-freccia{stroke:var(--azione);stroke-width:5;stroke-linecap:round}
.g-punta{fill:var(--azione)}
.g-dito{fill:var(--viola);opacity:.85}
.g-onda{fill:none;stroke:var(--viola);stroke-width:2.5;opacity:.6}
.g-pausa{fill:none;stroke:var(--ambra);stroke-width:3;stroke-dasharray:4 3}
.g-et{font:600 12px var(--font);fill:#1C1C1E}
@media (prefers-color-scheme:dark){.g-cornice{fill:#3A3A3C}.g-schermo{fill:#1F2A44}.g-et{fill:#F2F2F7}.g-barra{fill:#F2F2F7}}
.ico-big{width:72px;height:72px;color:var(--testo)}
.ico-big svg{width:100%;height:100%}
.domanda{display:flex;flex-direction:column;gap:16px}
.testo-domanda{font-size:24px}
.scenario{padding:14px 18px;margin:0;color:var(--testo-2)}
.opzioni{display:flex;flex-direction:column;gap:12px}
.opzioni.vf{flex-direction:row}.opzioni.vf .opz{flex:1;text-align:center}
.griglia-icone{display:grid;grid-template-columns:repeat(4,1fr)}
.griglia-icone .opz{display:flex;justify-content:center;padding:18px}
.opz{min-height:56px;padding:14px 18px;text-align:left;border-radius:16px;font-size:19px;transition:transform .12s}
.opz:active{transform:scale(.98)}
.opz.scelta{outline:3px solid var(--azione);background:var(--vetro-forte)}
.opz.attivo{outline:3px dashed var(--testo);outline-offset:2px;background:color-mix(in srgb,var(--azione) 18%,var(--vetro-forte))}
.opz.ordina{display:flex;align-items:center;gap:14px}
.opz .num{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--azione-fondo);color:#fff;font-weight:700}
.opz .num:empty{background:transparent;border:2px dashed var(--testo-2)}
.abbina{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.abbina .col{display:flex;flex-direction:column;gap:12px}
.abbina .opz{display:flex;align-items:center;gap:14px}
.abbina .num{flex:none}
.opz.c0{outline:3px solid var(--coppia-1)}.opz.c0 .num{background:var(--coppia-1);color:var(--su-coppia)}
.opz.c1{outline:3px solid var(--coppia-2)}.opz.c1 .num{background:var(--coppia-2);color:var(--su-coppia)}
.opz.c2{outline:3px solid var(--coppia-3)}.opz.c2 .num{background:var(--coppia-3);color:var(--su-coppia)}
.opz.c3{outline:3px solid var(--coppia-4)}.opz.c3 .num{background:var(--coppia-4);color:var(--su-coppia)}
.aiuto{margin:0;color:var(--testo-2);font-size:18px}
.azioni-ordina{display:flex;gap:12px}
.gesto-box{padding:8px}
.ico-riga{display:inline-flex;align-items:center;gap:10px}
.ico-mini{width:36px;height:36px;flex:none;color:var(--testo)}.ico-mini svg{width:100%;height:100%}
@media (max-width:600px){.griglia-icone{grid-template-columns:repeat(2,1fr)}.abbina{grid-template-columns:1fr}}
.hero{padding:32px;text-align:center;max-width:620px;margin:6vh auto 0}
.hero-ico{width:72px;height:72px;margin:0 auto 12px;color:var(--azione)}
.avviso{background:color-mix(in srgb,var(--ambra) 16%,transparent);border-radius:12px;padding:10px 14px;color:var(--testo)}
.form{display:grid;gap:14px;text-align:left;margin-top:18px}
.form label{display:grid;gap:6px;font-weight:700}
.form input,.form select{font:inherit;min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid var(--bordo);background:var(--vetro-forte);color:var(--testo)}
.testata{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.progresso{padding:10px 18px}
.griglia-moduli{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tessera{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px;text-align:left;min-height:170px}
.tessera:disabled{cursor:default}
.t-ico{width:40px;height:40px;color:var(--azione)}.t-ico svg{width:100%;height:100%}
.t-nome{font-size:21px;font-weight:700}
.t-soglia{font-size:18px;color:var(--testo-2)}
.t-stato{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:700;font-size:18px}
.t-stato svg{width:22px;height:22px}
.tessera.ok .t-stato{color:var(--ok-testo)}
.tessera.rip{box-shadow:inset 0 0 0 2px var(--ambra),var(--ombra)}.tessera.rip .t-stato{color:var(--ambra-testo)}
.ricomincia{text-align:center;margin-top:24px}
.carta{padding:24px}
.pallini{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.pallino{width:44px;height:44px;border:0;background:none;position:relative}
.pallino::after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid var(--testo-2)}
.pallino.fatto::after{background:var(--azione);border-color:var(--azione)}
.pallino.qui::after{inset:10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--azione) 35%,transparent)}
.nav-modulo{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.centro{text-align:center}
.contatore{color:var(--testo-2)}
.esito{padding:28px;text-align:center;margin-bottom:22px}
.anello{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;display:grid;place-content:center;border:8px solid var(--ok)}
.esito.rip .anello{border-color:var(--ambra)}
.anello strong{font-size:40px;line-height:1}.anello span{font-size:18px;color:var(--testo-2)}
.revisione{padding:18px 22px;margin-bottom:14px}
.et-tua{font-weight:700;color:var(--ambra-testo)}.et-giusta{font-weight:700;color:var(--ok-testo)}
.perche{background:var(--vetro-forte);border-radius:12px;padding:10px 14px}
.fonte{color:var(--azione-testo);font-weight:700;display:inline-block;min-height:44px;padding-top:10px}
@media (max-width:820px){.griglia-moduli{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.griglia-moduli{grid-template-columns:1fr}}
.patente{max-width:760px;margin:4vh auto 0;padding:28px 32px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--azione) 14%,var(--vetro)),var(--vetro) 45%,color-mix(in srgb,var(--viola) 14%,var(--vetro)))}
.patente::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);
  background-size:250% 100%;animation:riflesso 6s linear infinite}
.patente>*{position:relative} /* il riflesso ::before resta sotto i contenuti */
@keyframes riflesso{from{background-position:120% 0}to{background-position:-120% 0}}
.p-testa{display:flex;justify-content:space-between;align-items:center;gap:16px}
.p-sopra{font-size:18px;color:var(--testo-2);text-transform:uppercase;letter-spacing:.08em}
.sigillo{width:110px;height:110px;border-radius:50%;flex:none;padding:6px;
  background:conic-gradient(from 0deg,#FFD86B,#7AD7F0,#C79BFF,#8CF0B4,#FFD86B);animation:gira 8s linear infinite}
.sigillo-int{width:100%;height:100%;border-radius:50%;background:var(--vetro-forte);display:grid;place-items:center;color:var(--oro);animation:gira 8s linear infinite reverse}
.sigillo-int svg{width:56%;height:56%}
@keyframes gira{to{transform:rotate(360deg)}}
.p-dati{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin:20px 0}
.p-dati dt{font-size:18px;color:var(--testo-2);text-transform:uppercase;letter-spacing:.06em}
.p-dati dd{margin:2px 0 0;font-size:22px;font-weight:700}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",monospace;letter-spacing:.06em}
.p-moduli{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-moduli li{display:flex;align-items:center;gap:10px;background:var(--vetro-forte);border-radius:12px;padding:10px 14px}
.p-moduli li svg{width:24px;height:24px;flex:none}.p-moduli li strong{margin-left:auto}
.p-orologio{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-top:20px;padding:14px 18px;border-radius:14px;background:color-mix(in srgb,var(--azione) 12%,transparent)}
.p-orologio #oro-ora{font-size:30px;font-weight:700;color:var(--azione-testo)}
.p-nota{color:var(--testo-2);font-size:18px;margin:12px 0 0}
@media (max-width:600px){.p-dati{grid-template-columns:1fr 1fr}.p-moduli{grid-template-columns:1fr}.sigillo{width:80px;height:80px}}
</style>
</head>

  { id:'lex-08', area:'lessico', tipo:'scelta', fonte:'glossario',

  { id:'lex-09', area:'lessico', tipo:'scelta', fonte:'glossario',

  { id:'lex-10', area:'lessico', tipo:'scelta', fonte:'glossario',

<script id="logica">
const CHIAVE_STATO = 'patenteIpad.v1';

function rngDa(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mescola(arr, rnd = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function indici(n) { return Array.from({ length: n }, (_, i) => i); }

function pescaDomande(banca, areaId, n, escludiIds = [], rnd = Math.random) {
  const area = banca.filter(d => d.area === areaId);
  const nuove = mescola(area.filter(d => !escludiIds.includes(d.id)), rnd);
  const viste = mescola(area.filter(d => escludiIds.includes(d.id)), rnd);
  return nuove.concat(viste).slice(0, n);
}

function preparaIstanza(d, rnd = Math.random) {
  let n = 0;
  if (d.tipo === 'scelta') n = d.opzioni.length;
  else if (d.tipo === 'abbina') n = d.coppie.length;
  else if (d.tipo === 'ordina') n = d.passi.length;
  return { d, ordine: n ? mescola(indici(n), rnd) : [] };
}

function valuta(ist, risposta) {
  const d = ist.d;
  if (d.tipo === 'scelta') return risposta === d.corretta;
  if (d.tipo === 'vf') return risposta === d.corretta;
  if (d.tipo === 'abbina' || d.tipo === 'ordina') {
    const n = d.tipo === 'abbina' ? d.coppie.length : d.passi.length;
    return Array.isArray(risposta) && risposta.length === n && risposta.every((v, i) => v === i);
  }
  return false;
}

function esitoModulo(areaId, corrette) {
  const area = AREE.find(a => a.id === areaId);
  return { superato: corrette >= area.soglia, punteggio: corrette, soglia: area.soglia };
}

const ALFABETO_CODICE = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codicePatente({ nome, cognome, classe, data, punteggi }) {
  const s = [nome, cognome, classe, data, punteggi.join('.')].join('|').toLowerCase();
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x5bd1e995) >>> 0;
  }
  let out = '', x = h1, y = h2;
  for (let i = 0; i < 8; i++) {
    const v = i < 4 ? x : y;
    out += ALFABETO_CODICE[(v >>> ((i % 4) * 5)) & 31];
  }
  return out;
}

function statoVuoto() { return { studente: null, moduli: {}, ultimeDomande: {} }; }

function caricaStato(storage) {
  try {
    const raw = storage && storage.getItem(CHIAVE_STATO);
    if (!raw) return statoVuoto();
    return Object.assign(statoVuoto(), JSON.parse(raw));
  } catch (e) { return statoVuoto(); }
}

function salvaStato(storage, stato) {
  try { storage && storage.setItem(CHIAVE_STATO, JSON.stringify(stato)); } catch (e) {}
}

function tuttiSuperati(stato) {
  return AREE.every(a => stato.moduli[a.id] && stato.moduli[a.id].superato);
}

function validaBanca(banca, icone, gesti) {
  const errori = [];
  const visti = new Set();
  const nomiIcone = new Set(icone.map(i => i.nome));
  const idGesti = new Set(gesti.map(g => g.id));
  const conteggio = {};
  for (const d of banca) {
    const t = `[${d.id || '?'}]`;
    if (!d.id) errori.push(`${t} id vuoto`);
    else if (visti.has(d.id)) errori.push(`${t} id duplicato`);
    visti.add(d.id);
    if (!AREE.some(a => a.id === d.area)) errori.push(`${t} area inesistente: ${d.area}`);
    else conteggio[d.area] = (conteggio[d.area] || 0) + 1;
    if (!FONTI[d.fonte]) errori.push(`${t} fonte inesistente: ${d.fonte}`);
    if (!d.testo) errori.push(`${t} testo vuoto`);
    if (!d.spiega) errori.push(`${t} spiega vuota`);
    if (d.tipo === 'scelta') {
      const o = d.opzioni || [];
      if (o.length < 3 || o.length > 4 || o.some(x => !x) || new Set(o).size !== o.length)
        errori.push(`${t} opzioni non valide (3-4, distinte)`);
      if (!Number.isInteger(d.corretta) || d.corretta < 0 || d.corretta >= o.length)
        errori.push(`${t} corretta fuori range`);
      if (d.opzioniIcone && o.some(x => !nomiIcone.has(x))) errori.push(`${t} opzioniIcone con icona inesistente`);
    } else if (d.tipo === 'vf') {
      if (typeof d.corretta !== 'boolean') errori.push(`${t} corretta non booleana`);
    } else if (d.tipo === 'abbina') {
      if (!Array.isArray(d.coppie) || d.coppie.length !== 4) errori.push(`${t} servono 4 coppie`);
    } else if (d.tipo === 'ordina') {
      const p = d.passi || [];
      if (p.length < 3 || p.length > 5 || new Set(p).size !== p.length) errori.push(`${t} passi non validi (3-5, distinti)`);
    } else errori.push(`${t} tipo sconosciuto: ${d.tipo}`);
    if (d.icona && !nomiIcone.has(d.icona)) errori.push(`${t} icona inesistente: ${d.icona}`);
    if (d.gesto && !idGesti.has(d.gesto)) errori.push(`${t} gesto inesistente: ${d.gesto}`);
  }
  for (const a of AREE) if ((conteggio[a.id] || 0) < 15) errori.push(`area ${a.id}: servono almeno 15 domande (${conteggio[a.id] || 0})`);
  return errori;
}

globalThis.PATENTE = { AREE, FONTI, DOMANDE_PER_MODULO, CLASSI, ICONE, GESTI, BANCA,
  rngDa, mescola, pescaDomande, preparaIstanza, valuta, esitoModulo, codicePatente,
  statoVuoto, caricaStato, salvaStato, tuttiSuperati, validaBanca };
</script>

function svgIcona(nome, label = nome) {
  const i = ICONE.find(x => x.nome === nome);
  if (!i) return '';
  return i.svg.replace('<svg ', label ? `<svg role="img" aria-label="${esc(label)}" ` : '<svg aria-hidden="true" ');
}
function rigaIcona(nome) { return `<span class="ico-riga"><span class="ico-mini">${svgIcona(nome, '')}<\/span>${esc(nome)}<\/span>`; }

const ZONE = { // punto di partenza su schermo 200x130 (offset 20,20)
  'basso':[120,146], 'barra':[120,144], 'alto-destra':[200,26], 'alto-sinistra':[40,26],
  'centro-alto':[120,40], 'bordo-destro':[216,85], 'schermo':[120,85] };
const VETT = { su:[0,-70], giu:[0,70], sinistra:[-70,0], destra:[70,0] };

let nGesti = 0; // id univoco del marker: più gesti nella stessa pagina (revisione)
function svgGesto(id) {
  const g = GESTI.find(x => x.id === id);
  const mid = 'punta-' + (++nGesti);
  const [x, y] = g.zona === 'schermo' && g.dir === 'giu' ? [120, 50] : ZONE[g.zona];
  const dita = g.dita || 1;
  let segni = '';
  const punto = (px, py) => `<circle cx="${px}" cy="${py}" r="7" class="g-dito"/>`;
  if (VETT[g.dir]) {
    let [dx, dy] = VETT[g.dir];
    if (g.corto) { dx /= 3; dy /= 3; }
    for (let k = 0; k < dita; k++) {
      const off = (k - (dita - 1) / 2) * 18;
      const ox = dx ? 0 : off, oy = dx ? off : 0;
      segni += `<line x1="${x+ox}" y1="${y+oy}" x2="${x+ox+dx}" y2="${y+oy+dy}" class="g-freccia" marker-end="url(#${mid})"/>` + punto(x+ox, y+oy);
    }
    if (g.pausa) segni += `<circle cx="${x+dx}" cy="${y+dy}" r="13" class="g-pausa"/><text x="${x+dx+18}" y="${y+dy+5}" class="g-et">pausa</text>`;
  } else if (g.dir === 'tocco' || g.dir === 'premi') {
    segni += punto(x, y);
    const n = g.tocchi || 1;
    for (let k = 1; k <= (g.dir === 'premi' ? 1 : n); k++) segni += `<circle cx="${x}" cy="${y}" r="${7 + k * 7}" class="g-onda"/>`;
    segni += `<text x="${x}" y="${y + 44}" text-anchor="middle" class="g-et">${g.dir === 'premi' ? 'tieni premuto' : n + ' tocchi'}</text>`;
  } else { // pizzica / apri
    const verso = g.dir === 'apri' ? 1 : -1;
    for (let k = 0; k < dita; k++) {
      const ang = (Math.PI * 2 * k) / dita - Math.PI / 2;
      const r1 = verso > 0 ? 14 : 44, r2 = verso > 0 ? 44 : 14;
      segni += `<line x1="${x+Math.cos(ang)*r1}" y1="${y+Math.sin(ang)*r1}" x2="${x+Math.cos(ang)*r2}" y2="${y+Math.sin(ang)*r2}" class="g-freccia" marker-end="url(#${mid})"/>` + punto(x+Math.cos(ang)*r1, y+Math.sin(ang)*r1);
    }
  }
  return `<svg viewBox="0 0 240 170" class="ipad-gesto" role="img" aria-label="Gesto illustrato su iPad">
    <defs><marker id="${mid}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="g-punta"/></marker></defs>
    <rect x="6" y="6" width="228" height="158" rx="18" class="g-cornice"/>
    <rect x="20" y="20" width="200" height="130" rx="8" class="g-schermo"/>
    <rect x="95" y="141" width="50" height="4" rx="2" class="g-barra"/>
    ${segni}</svg>`;
}

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

function rispostaCompleta(ist, r) {
  const d = ist.d;
  if (d.tipo === 'scelta') return Number.isInteger(r);
  if (d.tipo === 'vf') return typeof r === 'boolean';
  if (d.tipo === 'abbina') return Array.isArray(r) && r.length === d.coppie.length && r.every(v => Number.isInteger(v));
  if (d.tipo === 'ordina') return Array.isArray(r) && r.length === d.passi.length;
  return false;
}

function renderDomanda(ist, r, onRisposta, attivo = null, onAttivo = () => {}) {
  const d = ist.d, box = el('div', 'domanda');
  if (d.scenario) box.append(el('p', 'scenario vetro', esc(d.scenario)));
  if (d.icona) box.append(el('div', 'ico-big', svgIcona(d.icona, 'Icona da riconoscere')));
  if (d.gesto) box.append(el('div', 'gesto-box', svgGesto(d.gesto)));
  box.append(el('h2', 'testo-domanda', esc(d.testo)));

  if (d.tipo === 'scelta') {
    const lista = el('div', d.opzioniIcone ? 'opzioni griglia-icone' : 'opzioni');
    ist.ordine.forEach(orig => {
      const b = el('button', 'opz vetro' + (r === orig ? ' scelta' : ''),
        d.opzioniIcone ? `<span class="ico-big">${svgIcona(d.opzioni[orig])}<\/span>` : esc(d.opzioni[orig]));
      b.setAttribute('aria-pressed', r === orig);
      if (d.opzioniIcone) b.setAttribute('aria-label', d.opzioni[orig]);
      b.onclick = () => onRisposta(orig);
      lista.append(b);
    });
    box.append(lista);
  } else if (d.tipo === 'vf') {
    const lista = el('div', 'opzioni vf');
    [[true, 'Vero'], [false, 'Falso']].forEach(([v, t]) => {
      const b = el('button', 'opz vetro' + (r === v ? ' scelta' : ''), t);
      b.setAttribute('aria-pressed', r === v);
      b.onclick = () => onRisposta(v);
      lista.append(b);
    });
    box.append(lista);
  } else if (d.tipo === 'abbina') {
    const cur = Array.isArray(r) ? r.slice() : new Array(d.coppie.length).fill(null);
    const colori = ['c0', 'c1', 'c2', 'c3'];
    const grid = el('div', 'abbina');
    const sx = el('div', 'col'), dx = el('div', 'col');
    d.coppie.forEach(([a], i) => {
      const b = el('button', 'opz vetro' + (cur[i] != null ? ' ' + colori[i] : '') + (attivo === i ? ' attivo' : ''),
        (cur[i] != null ? `<span class="num">${i + 1}<\/span>` : '') + esc(a));
      b.setAttribute('aria-pressed', attivo === i);
      b.onclick = () => {
        if (cur[i] != null) { cur[i] = null; onRisposta(cur.slice()); return; }
        onAttivo(i);
      };
      sx.append(b);
    });
    ist.ordine.forEach(orig => {
      const usataDa = cur.indexOf(orig);
      const b = el('button', 'opz vetro' + (usataDa >= 0 ? ' ' + colori[usataDa] : ''),
        (usataDa >= 0 ? `<span class="num">${usataDa + 1}<\/span>` : '') + esc(d.coppie[orig][1]));
      b.onclick = () => {
        if (usataDa >= 0) { cur[usataDa] = null; onRisposta(cur.slice()); return; }
        if (attivo == null) return;
        cur[attivo] = orig; onAttivo(null); onRisposta(cur.slice());
      };
      dx.append(b);
    });
    grid.append(sx, dx);
    box.append(el('p', 'aiuto', 'Tocca una voce a sinistra, poi quella che le corrisponde a destra.'), grid);
  } else if (d.tipo === 'ordina') {
    const cur = Array.isArray(r) ? r.slice() : [];
    const lista = el('div', 'opzioni');
    ist.ordine.forEach(orig => {
      const pos = cur.indexOf(orig);
      const b = el('button', 'opz vetro ordina' + (pos >= 0 ? ' scelta' : ''),
        `<span class="num">${pos >= 0 ? pos + 1 : ''}<\/span>${esc(d.passi[orig])}`);
      b.disabled = pos >= 0;
      b.onclick = () => onRisposta(cur.concat(orig));
      lista.append(b);
    });
    const az = el('div', 'azioni-ordina');
    const ann = el('button', 'btn sec', 'Annulla ultimo'); ann.disabled = !cur.length; ann.onclick = () => onRisposta(cur.slice(0, -1));
    const ric = el('button', 'btn sec', 'Ricomincia'); ric.disabled = !cur.length; ric.onclick = () => onRisposta([]);
    az.append(ann, ric);
    box.append(el('p', 'aiuto', 'Tocca i passaggi nell\'ordine giusto.'), lista, az);
  }
  return box;
}

const STORE = (() => { try { return window.sessionStorage; } catch (e) { return null; } })();
let stato = caricaStato(STORE);
let modulo = null; // { area, istanze, risposte, i, attivo }

function salva() { salvaStato(STORE, stato); }
function mostra(id, scroll = true) {
  document.querySelectorAll('.schermata').forEach(s => s.classList.toggle('attiva', s.id === id));
  if (scroll) window.scrollTo(0, 0);
}
function oggiISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

const SVG_PATENTE = `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="10" width="40" height="28" rx="5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="22" r="5" fill="currentColor"/><path d="M9 32c2-4 12-4 14 0" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M28 20h10M28 26h10M28 32h6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`;
const SVG_BOLLINO = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--oro)"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_AREA = {
  regole:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>`,
  icone:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>`,
  gesti:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 013 0v5"/><path d="M12 10V4a1.5 1.5 0 013 0v6"/><path d="M15 10V6a1.5 1.5 0 013 0v8a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L4 14a1.5 1.5 0 012.5-1.7L9 15"/></svg>`,
  lessico:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/></svg>`,
  procedure:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="5" cy="18" r="2"/><path d="M10 6h10M10 12h10M10 18h10"/></svg>`,
  sicurezza:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>`,
};

function renderIscrizione() {
  const s = document.getElementById('s-iscrizione');
  s.innerHTML = `
    <div class="hero vetro">
      <div class="hero-ico">${SVG_PATENTE}</div>
      <h1>Patente dell'iPad</h1>
      <p>Sei moduli, dieci domande ciascuno. Superali tutti e ottieni la patente. Puoi riprovare ogni modulo quante volte vuoi.</p>
      <p class="avviso">Attenzione: tutto si cancella quando chiudi questa pagina. Mostra la patente al docente prima di chiuderla.</p>
      <form id="f-iscr" class="form">
        <label>Nome<input name="nome" autocomplete="off" required minlength="2"></label>
        <label>Cognome<input name="cognome" autocomplete="off" required minlength="2"></label>
        <label>Classe<select name="classe" required><option value="">Scegli</option>${CLASSI.map(c => `<option>${c}</option>`).join('')}</select></label>
        <button class="btn" type="submit">Inizia</button>
      </form>
    </div>`;
  s.querySelector('#f-iscr').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const nome = f.get('nome').trim(), cognome = f.get('cognome').trim(), classe = f.get('classe');
    if (nome.length < 2 || cognome.length < 2 || !classe) return;
    stato.studente = { nome, cognome, classe };
    salva(); renderLibretto();
  };
  mostra('s-iscrizione');
}

function renderLibretto() {
  if (tuttiSuperati(stato)) return renderCertificato();
  const s = document.getElementById('s-libretto');
  const st = stato.studente;
  const superati = AREE.filter(a => stato.moduli[a.id]?.superato).length;
  s.innerHTML = `
    <header class="testata">
      <div><h1>Il tuo libretto</h1><p>${esc(st.nome)} ${esc(st.cognome)} · ${esc(st.classe)}</p></div>
      <div class="progresso vetro"><strong>${superati}</strong> / 6 moduli</div>
    </header>
    <div class="griglia-moduli">${AREE.map(a => {
      const m = stato.moduli[a.id];
      const cls = m ? (m.superato ? 'ok' : 'rip') : '';
      const et = m ? (m.superato ? `${SVG_BOLLINO} Superato · ${m.punteggio}/10` : `Da ripassare · ${m.punteggio}/10`) : 'Da fare';
      return `<button class="tessera vetro ${cls}" data-area="${a.id}" ${m?.superato ? 'disabled' : ''}>
        <span class="t-ico">${SVG_AREA[a.id]}</span>
        <span class="t-nome">${esc(a.nome)}</span>
        <span class="t-soglia">Per superarlo: ${a.soglia}/10</span>
        <span class="t-stato">${et}</span></button>`;
    }).join('')}</div>
    <p class="ricomincia"><button class="btn sec" id="b-reset">Ricomincia da capo</button></p>`;
  s.querySelectorAll('.tessera').forEach(b => b.onclick = () => avviaModulo(b.dataset.area));
  s.querySelector('#b-reset').onclick = () => {
    if (!confirm('Vuoi cancellare nome e moduli superati e ricominciare?')) return;
    stato = statoVuoto(); salva(); renderIscrizione();
  };
  mostra('s-libretto');
}

function avviaModulo(areaId) {
  const escl = stato.ultimeDomande[areaId] || [];
  const domande = pescaDomande(BANCA, areaId, DOMANDE_PER_MODULO, escl);
  stato.ultimeDomande[areaId] = domande.map(d => d.id); salva();
  modulo = { area: areaId, istanze: domande.map(d => preparaIstanza(d)), risposte: [], i: 0, attivo: null };
  renderModulo();
}

function renderModulo(scroll = true) {
  const s = document.getElementById('s-modulo');
  const area = AREE.find(a => a.id === modulo.area);
  const ist = modulo.istanze[modulo.i];
  const n = modulo.istanze.length;
  const tutte = modulo.istanze.every((x, k) => rispostaCompleta(x, modulo.risposte[k]));
  s.innerHTML = `
    <header class="testata"><h2>${esc(area.nome)}</h2><span class="contatore">Domanda ${modulo.i + 1} di ${n}</span></header>
    <div class="pallini">${modulo.istanze.map((x, k) => `<button class="pallino ${rispostaCompleta(x, modulo.risposte[k]) ? 'fatto' : ''} ${k === modulo.i ? 'qui' : ''}" data-k="${k}" aria-label="Vai alla domanda ${k + 1}"></button>`).join('')}</div>
    <div class="carta vetro" id="carta"></div>
    <nav class="nav-modulo">
      <button class="btn sec" id="b-prec" ${modulo.i === 0 ? 'disabled' : ''}>Indietro</button>
      ${modulo.i < n - 1 ? '<button class="btn" id="b-succ">Avanti</button>' : `<button class="btn" id="b-consegna" ${tutte ? '' : 'disabled'}>Consegna</button>`}
    </nav>
    ${modulo.i === n - 1 && !tutte ? '<p class="aiuto centro">Per consegnare rispondi a tutte le domande (i pallini pieni sono quelle fatte).</p>' : ''}
    <p class="centro"><button class="btn sec" id="b-esci">Torna al libretto</button></p>`;
  s.querySelector('#carta').append(renderDomanda(ist, modulo.risposte[modulo.i],
    r => { modulo.risposte[modulo.i] = r; renderModulo(false); },
    modulo.attivo, i => { modulo.attivo = i; renderModulo(false); }));
  s.querySelectorAll('.pallino').forEach(b => b.onclick = () => { modulo.i = +b.dataset.k; modulo.attivo = null; renderModulo(); });
  s.querySelector('#b-prec').onclick = () => { modulo.i--; modulo.attivo = null; renderModulo(); };
  const succ = s.querySelector('#b-succ'); if (succ) succ.onclick = () => { modulo.i++; modulo.attivo = null; renderModulo(); };
  const cons = s.querySelector('#b-consegna'); if (cons) cons.onclick = consegna;
  s.querySelector('#b-esci').onclick = () => { if (!modulo.risposte.some(r => r !== undefined) || confirm('Uscendo perdi le risposte di questo tentativo. Vuoi uscire?')) renderLibretto(); };
  mostra('s-modulo', scroll);
}

function consegna() {
  const risultati = modulo.istanze.map((ist, k) => ({ ist, r: modulo.risposte[k], ok: valuta(ist, modulo.risposte[k]) }));
  const es = esitoModulo(modulo.area, risultati.filter(x => x.ok).length);
  stato.moduli[modulo.area] = { superato: es.superato, punteggio: es.punteggio, data: oggiISO() };
  salva();
  renderEsito(modulo.area, risultati, es);
}

function testoRisposta(ist, r) {
  const d = ist.d;
  if (d.tipo === 'scelta') return d.opzioniIcone ? rigaIcona(d.opzioni[r]) : esc(d.opzioni[r]);
  if (d.tipo === 'vf') return r ? 'Vero' : 'Falso';
  if (d.tipo === 'abbina') return d.coppie.map((c, i) => `${esc(c[0])} → ${esc(d.coppie[r[i]][1])}`).join('<br>');
  if (d.tipo === 'ordina') return r.map((p, k) => `${k + 1}. ${esc(d.passi[p])}`).join('<br>');
}
function testoCorretta(ist) {
  const d = ist.d;
  if (d.tipo === 'scelta') return d.opzioniIcone ? rigaIcona(d.opzioni[d.corretta]) : esc(d.opzioni[d.corretta]);
  if (d.tipo === 'vf') return d.corretta ? 'Vero' : 'Falso';
  if (d.tipo === 'abbina') return d.coppie.map(c => `${esc(c[0])} → ${esc(c[1])}`).join('<br>');
  if (d.tipo === 'ordina') return d.passi.map((p, k) => `${k + 1}. ${esc(p)}`).join('<br>');
}

function renderEsito(areaId, risultati, es) {
  const s = document.getElementById('s-esito');
  const area = AREE.find(a => a.id === areaId);
  const errate = risultati.filter(x => !x.ok);
  s.innerHTML = `
    <div class="esito vetro ${es.superato ? 'ok' : 'rip'}">
      <div class="anello"><strong>${es.punteggio}</strong><span>su 10</span></div>
      <h1>${es.superato ? 'Modulo superato' : 'Ancora un ripasso'}</h1>
      <p>${esc(area.nome)} · serviva ${es.soglia}/10.</p>
    </div>
    ${errate.length ? `<h2>Rivediamo insieme</h2>${errate.map(x => {
      const f = FONTI[x.ist.d.fonte], d = x.ist.d;
      return `<article class="revisione vetro">
        ${d.icona ? `<div class="ico-big">${svgIcona(d.icona, 'Icona da riconoscere')}</div>` : ''}
        ${d.gesto ? `<div class="gesto-box">${svgGesto(d.gesto)}</div>` : ''}
        <h3>${esc(x.ist.d.testo)}</h3>
        <p><span class="et-tua">La tua risposta</span><br>${testoRisposta(x.ist, x.r)}</p>
        <p><span class="et-giusta">Risposta giusta</span><br>${testoCorretta(x.ist)}</p>
        <p class="perche">${esc(x.ist.d.spiega)}</p>
        <a class="fonte" href="${f.url}" target="_blank" rel="noopener">Ripassa su ${esc(f.nome)}</a>
      </article>`; }).join('')}` : ''}
    <nav class="nav-modulo">
      <button class="btn sec" id="b-lib">${tuttiSuperati(stato) ? 'Vedi la patente' : 'Torna al libretto'}</button>
      ${es.superato ? '' : '<button class="btn" id="b-riprova">Riprova subito</button>'}
    </nav>`;
  s.querySelector('#b-lib').onclick = renderLibretto;
  const rp = s.querySelector('#b-riprova'); if (rp) rp.onclick = () => avviaModulo(areaId);
  mostra('s-esito');
}

// Certificato (Task 7)
let timerOrologio = null;
function renderCertificato() {
  const s = document.getElementById('s-certificato');
  const st = stato.studente;
  const dataRil = AREE.map(a => stato.moduli[a.id].data).sort().pop();
  const punteggi = AREE.map(a => stato.moduli[a.id].punteggio);
  const codice = codicePatente({ ...st, data: dataRil, punteggi });
  const [y, m, d] = dataRil.split('-');
  s.innerHTML = `
    <div class="patente vetro">
      <div class="p-testa">
        <div><span class="p-sopra">Scuola Sacra Famiglia · Orzinuovi</span><h1>Patente dell'iPad</h1></div>
        <div class="sigillo" aria-hidden="true"><div class="sigillo-int">${SVG_PATENTE}</div></div>
      </div>
      <dl class="p-dati">
        <div><dt>Cognome</dt><dd>${esc(st.cognome)}</dd></div>
        <div><dt>Nome</dt><dd>${esc(st.nome)}</dd></div>
        <div><dt>Classe</dt><dd>${esc(st.classe)}</dd></div>
        <div><dt>Rilasciata il</dt><dd>${d}/${m}/${y}</dd></div>
        <div><dt>N. patente</dt><dd class="mono">${codice}</dd></div>
      </dl>
      <ul class="p-moduli">${AREE.map(a => `<li>${SVG_BOLLINO}<span>${esc(a.nome)}</span><strong>${stato.moduli[a.id].punteggio}/10</strong></li>`).join('')}</ul>
      <div class="p-orologio" aria-live="off"><span id="oro-data"></span><span id="oro-ora" class="mono"></span></div>
      <p class="p-nota">Mostra questa schermata al docente. L'orologio scorre: uno screenshot non vale.</p>
    </div>`;
  const tick = () => {
    const n = new Date();
    const dd = s.querySelector('#oro-data'), oo = s.querySelector('#oro-ora');
    if (!dd) return;
    dd.textContent = n.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    oo.textContent = n.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  };
  clearInterval(timerOrologio); tick(); timerOrologio = setInterval(tick, 1000);
  mostra('s-certificato');
}

// (renderCertificato usa timerOrologio: chiamarlo prima della sua dichiarazione = TDZ, pagina bianca)

  const errori = validaBanca(BANCA, ICONE, GESTI);
  if (errori.length) console.warn('Banca domande:', errori);

})();
